# Base común a todos los entornos. Los overlays (k8s/overlays/<entorno>) añaden encima
# las imágenes, el ConfigMap y la identidad del entorno.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Todos los recursos de abajo se crean en este namespace
namespace: gymscreen

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - gateway.yaml
  - httproute.yaml
  - job-migrate.yaml
