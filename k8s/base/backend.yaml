# Backend: API de Django (docker/backend/Dockerfile) servida por Gunicorn en el puerto 8000.
# Configuración: el overlay genera el ConfigMap backend-config (ENV, KEY_VAULT_URL,
# APP_CONFIG_ENDPOINT y sustituciones); los secretos se leen de Key Vault al arrancar.

# Identidad de los pods en Azure (Workload Identity). DefaultAzureCredential la usa
# para leer Key Vault y App Configuration, sin credenciales guardadas en el clúster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: gymscreen
  annotations:
    # Client ID de la identidad administrada: lo fija cada overlay
    azure.workload.identity/client-id: set-by-overlay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: gymscreen
    # Permite aplicar todo menos los Deployments (-l 'app.kubernetes.io/component!=servidor')
    # y esperar al Job de migraciones antes de actualizarlos
    app.kubernetes.io/component: servidor
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # un pod nuevo debe estar listo antes de retirar uno viejo
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: gymscreen
        # El webhook de Workload Identity inyecta AZURE_CLIENT_ID, AZURE_TENANT_ID
        # y el archivo del token federado en los pods con esta etiqueta
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001   # mismo UID que el usuario de la imagen
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: gymscreen-backend   # el overlay fija el registro y la etiqueta
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          # El arranque carga la configuración desde Azure: hasta 2 minutos
          # (24 x 5 s) antes de que la liveness tome el control
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          # Proceso vivo; nunca consulta la base, así una caída de la base no reinicia los pods
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Base de datos accesible; mientras falla, el pod no recibe tráfico
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi   # sin límite de CPU: evita el estrangulamiento; las requests reservan su parte
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Espacio temporal con escritura; el resto del sistema de archivos es de solo lectura
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: gymscreen
spec:
  type: ClusterIP   # solo interno: el Gateway envía /api/v1/ aquí
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
