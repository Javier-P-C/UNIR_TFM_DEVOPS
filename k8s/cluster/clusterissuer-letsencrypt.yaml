# Emisores de certificados de Let's Encrypt para cert-manager (v1.21.3).
# Son de ámbito de clúster, igual que la GatewayClass, así que quedan fuera de Kustomize:
#   kubectl apply -f k8s/cluster/clusterissuer-letsencrypt.yaml
#
# Dos emisores con la misma configuración y distinto servidor ACME:
#   letsencrypt-staging  certificados no confiables por los navegadores, sin el límite de
#                        producción. Para depurar el runbook.
#   letsencrypt-prod     certificados válidos. Límite de 5 certificados duplicados por semana
#                        para el mismo conjunto de nombres de host, así que solo se usa en las
#                        repeticiones medidas.
# El emisor se elige en el Certificate (k8s/overlays/prod/certificado.yaml, issuerRef).
#
# Desafío HTTP-01 resuelto por el Gateway (no por un Ingress): cert-manager crea una HTTPRoute
# temporal en el listener del puerto 80 con la ruta exacta /.well-known/acme-challenge/<token>.
# Requiere instalar cert-manager con config.gatewayAPI.enabled=true y después de las CRD de
# Gateway API (las instala Envoy Gateway).
# Referencia: https://cert-manager.io/docs/configuration/acme/http01/
#
# Sin correo de contacto: es opcional en ACME y evita poner datos personales en el repositorio.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Clave de la cuenta ACME. Se guarda en el namespace de cert-manager.
    privateKeySecretRef:
      name: letsencrypt-staging-cuenta
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: gymscreen
                namespace: gymscreen
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-cuenta
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: gymscreen
                namespace: gymscreen
                sectionName: http
