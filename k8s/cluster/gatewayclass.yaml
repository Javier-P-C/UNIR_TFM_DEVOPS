# Configuración a nivel de clúster: se aplica una vez por clúster, justo después de instalar Envoy Gateway:
#   kubectl apply -f k8s/cluster/gatewayclass.yaml
#
# No forma parte de la base de Kustomize: una GatewayClass es de ámbito de clúster y pertenece a la
# instalación del controlador, no a la aplicación. Kustomize no sabe que este recurso personalizado
# es de ámbito de clúster y le añadiría por error el namespace gymscreen.
#
# Los Gateway con gatewayClassName "envoy" los gestiona Envoy Gateway, que crea para cada uno
# un proxy Envoy y un Service LoadBalancer (IP pública).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
