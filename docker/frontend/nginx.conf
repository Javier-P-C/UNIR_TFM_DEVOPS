# Bloque server de la imagen del frontend (sustituye /etc/nginx/conf.d/default.conf).
# Sirve la compilación de Vite (dist/) como una aplicación de una sola página (SPA).
# /api/v1/ no se atiende aquí: el Gateway la envía al backend.
server {
    # nginx-unprivileged corre sin root, así que no puede usar el puerto 80
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sondas de Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite pone un hash del contenido en el nombre de estos archivos, así que pueden
    # guardarse en caché un año. Un archivo que no existe responde 404, no index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las rutas de la SPA (/ejercicios/5, ...) devuelven index.html y React Router las resuelve
    location / {
        try_files $uri /index.html;
    }

    # Nunca se guarda en caché, para que un despliegue nuevo se cargue en la siguiente visita
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
